server:
  port: 8085
  servlet:
    context-path: /api/v1

spring:
  application:
    name: ms-user

  datasource:
    url: jdbc:mysql://pymetrack-db.c9wmkhboh8bt.us-east-1.rds.amazonaws.com:3306/ms_user
    username: pymetrack
    password: pymetrack123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
      # Si sigue fallando por tablas antiguas, usa temporalmente:
      # ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

logging:
  level:
    cl.pymetrack.msuser: DEBUG
    org.springframework.security: DEBUG
    io.jsonwebtoken: DEBUG

jwt:
  secret: mySecretKey123456789012345678901234567890
  expiration: 86400
  refresh-expiration: 604800

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

app:
  auth:
    max-login-attempts: 5
    lock-duration-minutes: 30
    password-min-length: 8
